<!-- @dsCard group="Labels" height=200 subtitle="Filled, Outline, Inverse, Selected" -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-bg);color:var(--color-text-primary);font:400 16px/24px var(--font-sans);padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-16)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-12);align-items:center}
.tag{display:inline-flex;align-items:center;gap:var(--space-8);padding:var(--space-8) var(--space-16);border-radius:var(--radius-full);font:700 14px/20px var(--font-sans);color:var(--color-text-primary);background:none;border:0;cursor:pointer}
.tag:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
.filled{background:var(--color-surface)}
.outline{box-shadow:inset 0 0 0 1px var(--color-border)}
.inverse{background:var(--color-inverse-bg);color:var(--color-inverse-text)}
.selected{background:var(--color-primary);color:var(--color-on-primary)}
.dark{background:var(--color-bg);padding:var(--space-24);border-radius:var(--radius-lg)}
</style></head><body>
<div class="row"><button class="tag filled">Manufacturing</button><button class="tag outline">Manufacturing</button><button class="tag inverse">Manufacturing</button><button class="tag selected">AI &amp; ML</button></div>
<div class="dark" data-theme="dark"><div class="row"><button class="tag filled">Manufacturing</button><button class="tag outline">Manufacturing</button><button class="tag inverse">Manufacturing</button><button class="tag selected">AI &amp; ML</button></div></div>
</body></html>
