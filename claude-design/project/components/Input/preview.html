<!-- @dsCard group="Forms" height=520 subtitle="Field in five states, Underline for dark forms" -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-bg);color:var(--color-text-primary);font:400 16px/24px var(--font-sans);padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-24)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-24)}
.dark{background:var(--color-bg);padding:var(--space-24);border-radius:var(--radius-lg);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--space-32)}

.field{display:flex;flex-direction:column;gap:var(--space-8);min-width:0}
.field label{font:700 14px/20px var(--font-sans)}
.box{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-12) var(--space-16);background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:inset 0 0 0 1px var(--color-border-subtle);transition:box-shadow .15s ease-out}
.box input{flex:1;min-width:0;border:0;outline:0;background:none;padding:0;font:400 16px/24px var(--font-sans);color:var(--color-text-primary)}
.box input::placeholder{color:var(--color-text-tertiary);opacity:1}
.box:hover,.box.is-hover{box-shadow:inset 0 0 0 1px var(--color-border)}
.box:focus-within,.box.is-focus{box-shadow:inset 0 0 0 2px var(--color-primary)}
.box.is-error{box-shadow:inset 0 0 0 1px var(--color-error)}
.box.is-disabled{background:var(--ink-200);box-shadow:inset 0 0 0 1px var(--color-border-subtle);cursor:not-allowed}
.dark .box.is-disabled{background:var(--ink-800)}
.box.is-disabled input{cursor:not-allowed}
.hint{font:500 12px/16px var(--font-sans);color:var(--color-text-secondary)}
.hint.err{color:var(--color-error)}
.hint.dis{color:var(--color-text-tertiary)}
.state{font:500 12px/16px var(--font-sans);color:var(--color-primary)}

.underline{display:flex;flex-direction:column;padding:0 0 var(--space-16);box-shadow:inset 0 -1px 0 var(--color-border)}
.underline input{border:0;outline:0;background:none;padding:0;font:400 16px/24px var(--font-sans);color:var(--color-text-primary)}
.underline input::placeholder{color:var(--color-text-secondary);opacity:1}
.underline:focus-within{box-shadow:inset 0 -1px 0 var(--color-primary)}
textarea{font:400 16px/24px var(--font-sans);min-height:120px;resize:none;border:0;outline:0;background:none;padding:0;width:100%;color:var(--color-text-primary)}
textarea::placeholder{color:var(--color-text-tertiary)}
</style></head><body>
<div class="grid">
  <div class="field"><label for="i1">Full name*</label><div class="box"><input id="i1" placeholder="Your full name"></div><span class="hint">Hint text</span><span class="state">Default</span></div>
  <div class="field"><label for="i2">Full name*</label><div class="box is-hover"><input id="i2" placeholder="Your full name"></div><span class="hint">Hint text</span><span class="state">Hover</span></div>
  <div class="field"><label for="i3">Full name*</label><div class="box is-focus"><input id="i3" value="Oleksandr Lukianets"></div><span class="hint">Hint text</span><span class="state">Focus</span></div>
  <div class="field"><label for="i4">Full name*</label><div class="box is-error"><input id="i4" placeholder="Enter your name"></div><span class="hint err">Please enter your name</span><span class="state">Error</span></div>
  <div class="field"><label for="i5">Full name*</label><div class="box is-disabled"><input id="i5" placeholder="Your full name" disabled></div><span class="hint dis">Hint text</span><span class="state">Disabled</span></div>
  <div class="field"><label for="i6">Message</label><div class="box" style="align-items:flex-start"><textarea id="i6" placeholder="Tell us about your project"></textarea></div><span class="hint">Textarea: same box, minimum height 120</span></div>
</div>
<div class="dark" data-theme="dark">
  <div class="underline"><input aria-label="Your full name" placeholder="Your full name*"></div>
  <div class="underline"><input aria-label="Corporate email" placeholder="Corporate email*"></div>
  <div class="field"><label for="i7">Full name*</label><div class="box"><input id="i7" placeholder="Your full name"></div><span class="hint">Field on a dark surface</span></div>
</div>
</body></html>
