<!-- @dsCard group="Actions" height=420 subtitle="Inverse, Primary, Outline, Surface in 24, 40, 48" -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-bg);color:var(--color-text-primary);font:400 16px/24px var(--font-sans);padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-16)}
.row{display:flex;gap:var(--space-24);align-items:center}
.cap{width:72px;font:500 12px/16px var(--font-sans);color:var(--color-text-secondary)}
.iw{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-full);font-family:Inter,var(--font-sans);line-height:1}
.s24{width:24px;height:24px;font-size:14px}.s40{width:40px;height:40px;font-size:20px}.s48{width:48px;height:48px;font-size:20px}
.inv{background:var(--color-inverse-bg);color:var(--color-inverse-text)}
.pri{background:var(--color-primary);color:var(--white)}
.out{background:none;box-shadow:inset 0 0 0 1px var(--color-border);color:var(--color-text-primary)}
.sur{background:var(--color-surface);color:var(--color-text-primary)}
.dark{background:var(--color-bg);padding:var(--space-24);border-radius:var(--radius-lg);display:flex;flex-direction:column;gap:var(--space-16)}
</style></head><body>
<div class="row"><span class="cap">Inverse</span><span class="iw inv s24">→</span><span class="iw inv s40">→</span><span class="iw inv s48">→</span></div>
<div class="row"><span class="cap">Primary</span><span class="iw pri s24">✓</span><span class="iw pri s40">→</span><span class="iw pri s48">→</span></div>
<div class="row"><span class="cap">Outline</span><span class="iw out s24">→</span><span class="iw out s40">→</span><span class="iw out s48">→</span></div>
<div class="row"><span class="cap">Surface</span><span class="iw sur s24">→</span><span class="iw sur s40">→</span><span class="iw sur s48">→</span></div>
<div class="dark" data-theme="dark"><div class="row"><span class="cap">Dark</span><span class="iw inv s40">→</span><span class="iw pri s40">→</span><span class="iw out s40">→</span><span class="iw sur s40">→</span></div></div>
</body></html>
